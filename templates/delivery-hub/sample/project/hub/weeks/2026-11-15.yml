    is highlighted.'
- text: '**Fixes from testing.** The upload progress bar no longer sticks at 99 percent, and long file names wrap
    instead of overflowing.'
decided_in_sync:
- text: Sharing links will expire after 30 days by default, and an admin can change that per team.
- text: The Reports page keeps its current layout. A saved-views feature is planned for the next phase.
