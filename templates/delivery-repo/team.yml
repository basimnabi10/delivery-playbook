# Written in Step 3: who is on the project and who holds each function.
# Recommended: the PM (or lead) owns all four functions from the start. When a function gets its own person, that
# person becomes its owner and the PM its backup. Pull requests for a function's folder are authored by its holder.
functions:
  project-management: {owner: ""}
  product-management: {owner: ""}
  design: {owner: ""}
  qa: {owner: ""}
people: []
# Optional fields per person: client_facing, engagement (billed | shadow),
# status (proposed | confirmed | left-client | inactive), introduced_to_client,
# receives: [delivery-hub], hub_access (view | comment)
readers: []   # GitHub teams with Read access, for example the project's devs and the execs; empty is valid
readers_note: ""   # why readers is empty, if it is
code_owners: {}   # {people: [id], reason: "..."} when the code owners differ from the function owners
