<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" role="img" aria-label="The design record: Never rendered on the Delivery Hub. Start with status.yml, then the latest log entry, then a flow's thinking and versions.">
<style>
.bg{fill:#F6F7FC;stroke:#E1E5F2}.bar{fill:#4156AF}.tile{fill:#EEF1FB}.ic{fill:none;stroke:#4156AF;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#5A6178;font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
.ttl{fill:#2C3C82;font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.tag{fill:#3A3F52;font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.chip{fill:#FFFFFF;stroke:#E1E5F2}.ctx{fill:#2C3C82;font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#151A2E;stroke:#273050}.bar{fill:#8EA0F0}.tile{fill:#1D2547}.ic{stroke:#8EA0F0}
.eye{fill:#98A0BA}.ttl{fill:#C3CDFF}.tag{fill:#CFD4E6}.chip{fill:#0E1222;stroke:#273050}.ctx{fill:#C3CDFF}}
</style>
<rect class="bg" x="1" y="1" width="878" height="250" rx="16"/>
<clipPath id="card"><rect x="1" y="1" width="878" height="250" rx="16"/></clipPath>
<rect class="bar" x="1" y="1" width="8" height="250" clip-path="url(#card)"/>
<rect class="tile" x="36" y="56.0" width="140" height="140" rx="22"/>
<g class="ic" transform="translate(58 78.0) scale(4)"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
<text class="eye" x="204" y="52">DESIGN/INTERNAL/ · TEAM ONLY</text>
<text class="ttl" x="204" y="84">The design record</text>
<text class="tag" x="204" y="112">Never rendered on the Delivery Hub. Start with status.yml, then the latest</text>
<text class="tag" x="204" y="136">log entry, then a flow's thinking and versions.</text>
<rect class="chip" x="204" y="162" width="100" height="26" rx="13"/>
<text class="ctx" x="215" y="179.5">status.yml</text>
<rect class="chip" x="312" y="162" width="148" height="26" rx="13"/>
<text class="ctx" x="323" y="179.5">design-files.yml</text>
<rect class="chip" x="468" y="162" width="108" height="26" rx="13"/>
<text class="ctx" x="479" y="179.5">screens.yml</text>
<rect class="chip" x="584" y="162" width="124" height="26" rx="13"/>
<text class="ctx" x="595" y="179.5">approvals.yml</text>
<rect class="chip" x="204" y="196" width="171" height="26" rx="13"/>
<text class="ctx" x="215" y="213.5">change-requests.yml</text>
<rect class="chip" x="383" y="196" width="163" height="26" rx="13"/>
<text class="ctx" x="394" y="213.5">open-questions.yml</text>
</svg>
