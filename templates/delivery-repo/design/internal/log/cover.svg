<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="The daily design log: One file per working day: what was done in Claude Design, on which flow, why, how long it took, and what is next.">
<style>
.bg{fill:#F6F7FC;stroke:#E1E5F2}.bar{fill:#4156AF}.tile{fill:#EEF1FB}.ic{fill:none;stroke:#4156AF;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.eye{fill:#5A6178;font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}
.ttl{fill:#2C3C82;font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.tag{fill:#3A3F52;font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.chip{fill:#FFFFFF;stroke:#E1E5F2}.ctx{fill:#2C3C82;font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#151A2E;stroke:#273050}.bar{fill:#8EA0F0}.tile{fill:#1D2547}.ic{stroke:#8EA0F0}
.eye{fill:#98A0BA}.ttl{fill:#C3CDFF}.tag{fill:#CFD4E6}.chip{fill:#0E1222;stroke:#273050}.ctx{fill:#C3CDFF}}
</style>
<rect class="bg" x="1" y="1" width="878" height="218" rx="16"/>
<clipPath id="card"><rect x="1" y="1" width="878" height="218" rx="16"/></clipPath>
<rect class="bar" x="1" y="1" width="8" height="218" clip-path="url(#card)"/>
<rect class="tile" x="36" y="40.0" width="140" height="140" rx="22"/>
<g class="ic" transform="translate(58 62.0) scale(4)"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><circle cx="12" cy="16" r="3"/><path d="M12 15v1.2l.8.6"/></g>
<text class="eye" x="204" y="52">DAY TO DAY</text>
<text class="ttl" x="204" y="84">The daily design log</text>
<text class="tag" x="204" y="112">One file per working day: what was done in Claude Design, on which flow,</text>
<text class="tag" x="204" y="136">why, how long it took, and what is next.</text>
<rect class="chip" x="204" y="162" width="124" height="26" rx="13"/>
<text class="ctx" x="215" y="179.5">YYYY-MM-DD.md</text>
<rect class="chip" x="336" y="162" width="116" height="26" rx="13"/>
<text class="ctx" x="347" y="179.5">_template.md</text>
</svg>
