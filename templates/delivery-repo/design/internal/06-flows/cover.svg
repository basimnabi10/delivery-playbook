<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="The product, flow by flow: One folder per flow built in Claude Design, with its brief, design thinking, every version and the dev handoff.">
<style>
