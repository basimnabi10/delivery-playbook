<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" role="img" aria-label="One flow, start to handoff: Copy this folder and rename it for each new flow. Nine short files tell the whole story of that flow.">
<style>
