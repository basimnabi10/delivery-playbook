# Written in Step 2: where project information lives, and who may see what comes from it.
code:
  repos: []
  merge_branch: main       # the branch pull requests merge into; count_prs.py counts merges on it
  # deploy_branch: production   # optional, when production deploys from a different branch
sources: []   # each: id, type, ref, visibility, read (connector | api | browser | manual); optional owner, url, files, commercial
restricted_drive_folder: ""
versioning: {}
pages:
  delivery-hub: {audience: [client, team, execs]}
  hours: {enabled: false, basis: ""}   # Step 6 asks. If true, project/hub/hours.yml is required. basis: allocation | logged
rules:
  never_on_client_pages: [credentials, internal links, test pass rates, developer names]
  counting: {merged_pr: "", week_rule: "", week_ends: sunday, time_zone: UTC, script: count_prs}   # week_ends: the day a week ends
  publishing: {draft_only: true, weekly_slot: ""}
  scan: {hub_forbidden: [], restricted: []}   # regular expressions the scan looks for in hub/ and internal/
